<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>SmartVocabQuiz · 生成试题</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/ai-status.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="SmartVocabQuiz 首页">
        <span class="brand-mark" aria-hidden="true">V<span>·</span></span>
        <span class="brand-copy"><strong>SmartVocabQuiz</strong><small>本地词汇学习工作台</small></span>
      </a>
      <nav class="top-nav" aria-label="页面导航"><a class="back-link" href="/">← 功能选择</a><span class="local-badge"><span class="badge-dot"></span> 仅在本机运行</span><button id="ai-status" class="ai-indicator checking" type="button" title="点击重新检测本地 AI"><span class="ai-dot"></span><span class="ai-label">AI 检测中</span></button></nav>
    </header>

    <main class="quiz-main">
      <section class="quiz-placeholder" aria-labelledby="quiz-title">

        <p class="quiz-description">入口已经预留。后续会使用本地词库抽取英文单词，并在这里完成出题和练习。</p>
        <div class="quiz-actions"><a class="primary-button" href="/scan">前往扫描词汇 <span aria-hidden="true">↗</span></a><a class="secondary-button" href="/">返回功能选择</a></div>
      </section>
    </main>

    <footer><span>SmartVocabQuiz</span><span>本地数据 · 本地 AI · 由你掌控</span></footer>
  </div>
</body>
</html>
